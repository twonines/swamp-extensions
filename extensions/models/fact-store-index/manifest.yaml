manifestVersion: 1
name: "@twonines/fact-store-index"
version: "2026.07.10.1"
description: >
  Exports the active facts and constraints from a `@twonines/fact-store`
  instance into a portable SQLite index (FTS5 full-text + raw vector
  BLOBs), and serves hybrid search directly against it.

  Ships one model type — `@twonines/fact-store-index/exporter` — with an
  `export` method that takes the output of `fact-store.query` as input,
  computes embeddings against any OpenAI-compatible embeddings endpoint
  (OpenAI, LiteLLM, vLLM, etc.), and writes the SQLite database both to
  a configurable local path and as a portable `index` swamp resource.
  A `search` method fetches that resource, opens it in memory, and
  returns RRF-fused FTS5 + vector results — real semantic relevance,
  reachable from any session rather than only whichever machine last
  ran export. Local consumers such as `jitter` can still open the
  written file directly and combine BM25 with cosine similarity
  themselves if preferred.

  Prerequisites:
  - An OpenAI-compatible embeddings endpoint + bearer token. Point
    `embed_url` at your provider (OpenAI, LiteLLM proxy, self-hosted
    inference server) and wire `embed_token` from a swamp vault.
  - A `@twonines/fact-store` instance with active facts / constraints
    to export.
repository: "https://codeberg.org/twonines/swamp-extensions"
paths:
  base: manifest
models:
  - mod.ts
dependencies:
  - "@twonines/fact-store"
additionalFiles:
  - README.md
  - LICENSE.md
labels:
  - fact-store
  - index
  - sqlite
  - embeddings
  - hybrid-search
  - search
  - jitter
  - agent-context
