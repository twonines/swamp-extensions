manifestVersion: 1
name: "@twonines/fact-store-index"
version: "2026.07.07.1"
description: >
  Exports the active facts and constraints from a `@twonines/fact-store`
  instance into a local SQLite database with full-text search and vector
  embeddings so downstream tools can build sub-100ms just-in-time truth
  packets for AI agents without querying the swamp datastore on every
  prompt.

  Ships one model type — `@twonines/fact-store-index/exporter` — with an
  `export` method that takes the output of `fact-store.query` as input,
  computes embeddings against any OpenAI-compatible embeddings endpoint
  (OpenAI, LiteLLM, vLLM, etc.), and writes a portable SQLite file
  (FTS5 + raw vector BLOBs) to a configurable output path. Consumers
  such as `jitter` open the SQLite directly and combine BM25 with cosine
  similarity for hybrid retrieval.

  Prerequisites:
  - An OpenAI-compatible embeddings endpoint + bearer token. Point
    `embed_url` at your provider (OpenAI, LiteLLM proxy, self-hosted
    inference server) and wire `embed_token` from a swamp vault.
  - A `@twonines/fact-store` instance with active facts / constraints
    to export.
repository: "https://codeberg.org/twonines/swamp-extensions"
paths:
  base: manifest
models:
  - mod.ts
dependencies:
  - "@twonines/fact-store"
additionalFiles:
  - README.md
  - LICENSE.md
labels:
  - fact-store
  - index
  - sqlite
  - embeddings
  - hybrid-search
  - jitter
  - agent-context
