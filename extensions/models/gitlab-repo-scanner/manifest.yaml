manifestVersion: 1
name: "@twonines/gitlab-repo-scanner"
version: "2026.07.03.1"
description: >
  Scans a GitLab repository: returns structured metadata, a recursive file
  tree, and contents of known high-signal files. Provides fetch_files for
  on-demand content retrieval of paths discovered in the file tree.
repository: "https://codeberg.org/twonines/swamp-extensions"
paths:
  base: manifest
models:
  - mod.ts
workflows: []
vaults: []
drivers: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - LICENSE.md
labels:
  - gitlab
  - git
  - repository
  - scanner
  - devops
dependencies: []
