manifestVersion: 1
name: "@twonines/repo-indexer"
version: "2026.07.10.1"
description: >
  Clones a GitLab repository, chunks all text files, embeds them via an
  OpenAI-compatible API, and writes a SQLite database supporting hybrid
  search (FTS5 keyword + vector cosine with RRF reranking). Methods: index,
  search, reindex, status, discover, list-indexed, list-searches.
repository: "https://codeberg.org/twonines/swamp-extensions"
paths:
  base: manifest
models:
  - mod.ts
workflows: []
vaults: []
drivers: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - LICENSE.md
  - DESIGN.md
labels:
  - gitlab
  - git
  - repository
  - indexer
  - embeddings
  - search
  - sqlite
dependencies: []
