id: 376e305b-ead9-45c7-99a9-70c7e1e5f028
name: "@twonines/scan-repos"
version: 1
description: >
  Scan a list of GitLab repositories in parallel. Each repo produces a
  versioned scan resource — metadata, file tree, and high-signal file
  contents — for downstream consumption by fact-discovery agents loading
  the @twonines/fact-store propose-facts skill.

  Repo selection (discovery, random sampling, explicit lists) happens
  outside this workflow — typically via the scan-repos.sh wrapper script
  which runs discover, picks repos, then invokes this workflow with
  the selected paths.

inputs:
  required:
    - repos
  properties:
    repos:
      type: array
      items: { type: string }
      description: 'Repo paths to scan (e.g. ["cdh/apps/login", "cdh/platform"])'

jobs:
  - name: scan
    description: Scan each repo in parallel
    steps:
      - name: scan
        forEach:
          item: repo
          in: ${{ inputs.repos }}
        task:
          type: model_method
          modelIdOrName: repo-scanner
          methodName: scan
          inputs:
            projectPath: ${{ self.repo }}
