manifestVersion: 1
name: "@twonines/scan-repos"
version: "2026.07.03.3"
description: >
  Batch scan of GitLab repositories, orchestrated as a swamp workflow.
  Given an explicit list of repo paths, scans each in parallel. Given no
  list, first discovers active repos (optionally scoped to specific
  groups and/or by last-activity date), then scans each discovered repo.
  Produces one versioned `scan` resource per repo — the source-of-truth
  input to any downstream fact-discovery agent (typically one loading
  the @twonines/fact-store propose-facts skill).
repository: "https://codeberg.org/twonines/swamp-extensions"
paths:
  base: manifest
workflows:
  - workflow.yaml
dependencies:
  - "@twonines/gitlab-repo-scanner"
additionalFiles:
  - README.md
  - LICENSE.md
labels:
  - gitlab
  - repository
  - scanner
  - workflow
  - fact-store
