id: c7b0b61d-eb64-4918-9e85-ea3191934564
name: "@twonines/refresh-fact-index"
version: 1
description: >
  Refresh the local fact-store index. First runs `query` on a
  `@twonines/fact-store` instance to materialize the current active
  facts and constraints as a `query--global` data resource, then runs
  `export` on a `@twonines/fact-store-index/exporter` instance whose
  globalArguments include `truth_packet: ${{ data.latest("<facts>",
  "query--global").attributes }}` — so job 2's step resolves the
  refreshed truth packet automatically.

  Meant for scheduled use (nightly cron, workflow scheduler, etc.).
  Producing an updated SQLite file for consumers like `jitter` to
  serve at prompt time.

inputs:
  properties:
    fact_store_model:
      type: string
      description: >-
        Name of the `@twonines/fact-store` instance to query. Must
        match the name referenced by the exporter's `truth_packet`
        globalArgument CEL expression.
      default: "facts"
    fact_index_model:
      type: string
      description: >-
        Name of the `@twonines/fact-store-index/exporter` instance to
        run the export on.
      default: "fact-index"
    limit:
      type: integer
      description: >-
        Max active facts to include in the `query` step's output. The
        exporter processes everything the query returned.
      default: 10000
      minimum: 1

jobs:
  - name: query
    description: >-
      Refresh the fact-store's `query--global` data resource with the
      current active facts and constraints.
    steps:
      - name: run-query
        task:
          type: model_method
          modelIdOrName: ${{ inputs.fact_store_model }}
          methodName: query
          inputs:
            limit: ${{ inputs.limit }}

  - name: export
    description: >-
      Run the exporter, which reads the just-refreshed truth packet
      through its `truth_packet` globalArgument and writes the SQLite
      index file.
    dependsOn:
      - job: query
        condition:
          type: succeeded
    steps:
      - name: run-export
        task:
          type: model_method
          modelIdOrName: ${{ inputs.fact_index_model }}
          methodName: export
